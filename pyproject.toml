[project]
name = "showme"
version = "0.2.0"
description = "Raw image viewer for humans, driven by agents (web UI + MCP)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "tifffile>=2023.1",
  "imagecodecs>=2023.1",
  "starlette>=0.37",
  "uvicorn>=0.29",
]

[project.scripts]
showme = "showme.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
